<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/contactform.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lily+Script+One&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Magra:wght@400;700&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">
    <title>Document</title>
</head>


<body>
    <header>
        <img class = 'header' id = "header_logo" src="../Images/VKellog's Logo.png" alt="">
        
        <div id = 'navigation'>
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="recipes.html">Recipes</a>
        </div>
    </header>
    
    <div id="content" method = "get">

        <div id="formwrapper">
            <div id="formheader">
                <p>Contact Form</p>
            </div>

            <form id="form-container" >
                <div>
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div>
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" required>
                </div>
                <div id="inquiry-div">
                    <label for="natureOfInquiry">Nature of Inquiry</label>
                    <select id="natureOfInquiry" name="natureOfInquiry" required onchange="handleInquiryChange()">
                        <option value="business">Business</option>
                        <option value="complaint">Complaint</option>
                        <option value="support">Support</option>
                        <option value="feedback">Feedback</option>
                        <option value="other">Other</option>
                    </select>
                </div>


                <div id = 'messagewrapper'>
                    <label for="message">Message</label>

                    <textarea type="text" id="message" name="message" required placeholder="Enter your message"></textarea>

                </div>

                <div id ='buttonwrapper'>
                    <p id = 'errormsg'></p>
                    <button id = 'submitbutton' type="button">Submit</button>
                </div>
 
                

            </form>
        </div>


    </div>



    <footer>
        <img  src="../Images\VKellog's Logo.png" alt="">
        
        <div id = 'information'>

            <div id = 'aboutus'>
                <a href="aboutus.html"><h1>Who We Are</h1> <img src="../Images/arrow.svg" alt=""> </a>
                <p>Learn More About Us and What We Do!</p>
            </div>

            <div id = 'contact'>
                <a href="contactform.html"><h1>Contact Us</h1><img src="../Images/arrow.svg" alt=""> </a>
                <p>We Would Love to Hear From You!</p>

            </div>

            
        </div>
    </footer>
</body>
<script src="../js/contactform.js"></script>
</html>
